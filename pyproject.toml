[project]
name = "f1-telemetry-bff"
version = "0.1.0"
description = "Backend for Frontend for F1 telemetry head-to-head comparisons using OpenF1."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Matute0512", email = "matiast999@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

# ============================================================
# Ruff
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py312"

src = ["src", "tests"]

exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "RUF",
]

ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = [
    "f1_telemetry_bff",
]


# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
